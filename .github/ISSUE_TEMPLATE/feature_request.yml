name: 功能需求
description: 扩展插件功能或选项。
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 描述当前操作和希望解决的问题。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 目标与范围
      description: 描述期望行为、涉及的能力和明确不需要的功能。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 验证方法
      description: 可以验证结果的命令、沙箱操作或界面行为。
    validations:
      required: true
